dags:
  - dag_id: dynamic_sales_report
    schedule: "@daily"
    start_date: "2025-01-01"
    catchup: false
    tags: ["dynamic", "sales"]
    owner: "Astro"
    retries: 2
    shard_count: 4
    quality_threshold: 0.75
    params:
      source_table: "raw.sales"
      target_table: "reporting.sales_daily"
      region: "us-east"

